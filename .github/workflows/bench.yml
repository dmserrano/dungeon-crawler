name: bench
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: ./scripts/setup.sh
      - name: Bench head
        run: pnpm bench --json "$RUNNER_TEMP/head.json"
      - name: Bench merge-base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          cp -r bench "$RUNNER_TEMP/bench-new"
          git checkout --force "$base"
          # merge-base may predate the bench; use the new script against the old sim
          rm -rf bench && cp -r "$RUNNER_TEMP/bench-new" bench
          pnpm install --frozen-lockfile || true
          pnpm exec tsx bench/sim-bench.ts --json "$RUNNER_TEMP/base.json" || echo '[]' > "$RUNNER_TEMP/base.json"
          git checkout --force -
      - name: Compare
        run: |
          node bench/compare.mjs "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" 25 | tee report.md
          grep -v '^::warning' report.md >> "$GITHUB_STEP_SUMMARY" || true
          grep '^::warning' report.md || true
      - name: Update PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -v '^::warning' report.md > comment.md
          id=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" --jq '[.[] | select(.body | contains(""))][0].id // empty')
          if [ -n "$id" ]; then gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@comment.md
          else gh pr comment ${{ github.event.number }} --body-file comment.md; fi
