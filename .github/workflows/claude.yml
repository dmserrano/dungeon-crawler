name: Claude
on:
  # zizmor: ignore[dangerous-triggers] intentional: claude-code-action rejects actors without write access
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        !(github.event.issue.pull_request && contains(github.event.comment.body, '@claude review'))) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    # One run per issue or PR at a time; a second request waits instead of racing the first.
    # Job level, so comments that do not mention @claude never enter the group. GitHub keeps at
    # most one waiting run per group: a third request replaces the one still waiting.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1 # zizmor: ignore[artipacked] the agent commits and pushes branches with the checkout credential
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: ./scripts/setup.sh
      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The allowlist is a guardrail, not a sandbox: Bash(pnpm:*) can run arbitrary package
          # scripts. The real boundaries are the job token permissions above, the main branch
          # ruleset and the write-access gate on who can trigger this workflow. Do not add
          # Bash(git:*): it would allow force-push, git config, git remote set-url and bypassing
          # the action's push wrapper.
          claude_args: |
            --max-turns 100
            --max-budget-usd 3
            --allowedTools "Bash(pnpm:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
            --append-system-prompt "Turn budget: update your GitHub comment only twice, once with the plan at the start and once with the final summary. Do not update it after each todo. While iterating run only the affected tests (pnpm test <file>); run pnpm verify once at the end, and pnpm knip and pnpm test:coverage once each. Run each pnpm command on its own, never piped or chained, because piped commands are denied by the allowlist and waste turns. Do not re-read files you already read."
      # The action hides tool calls from the public job log; this prints counts only.
      - name: Summarize Claude tool usage
        if: always()
        run: node scripts/summarize-claude-run.mjs | tee -a "$GITHUB_STEP_SUMMARY"
