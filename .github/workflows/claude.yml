name: Claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        !(github.event.issue.pull_request && contains(github.event.comment.body, '@claude review'))) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: ./scripts/setup.sh
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 100
            --max-budget-usd 3
            --allowedTools "Bash(pnpm:*)"
            --append-system-prompt "Turn budget: update your GitHub comment only twice, once with the plan at the start and once with the final summary. Do not update it after each todo. While iterating run only the affected tests (pnpm test <file>); run pnpm verify once at the end, and pnpm knip and pnpm test:coverage once each. Run each pnpm command on its own, never piped or chained, because piped commands are denied by the allowlist and waste turns. Do not re-read files you already read."
      # The action hides tool calls from the public job log; this prints counts only.
      - name: Summarize Claude tool usage
        if: always()
        run: node scripts/summarize-claude-run.mjs | tee -a "$GITHUB_STEP_SUMMARY"
