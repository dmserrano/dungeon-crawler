name: Feature slice (agent-ready)
description: A self-contained vertical slice. Must make sense with no outside context.
labels: [slice]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What user-visible or sim-visible behavior exists after this slice?
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist. Include the replay/test that proves it.
    validations: { required: true }
  - type: textarea
    id: areas
    attributes:
      label: Areas touched
      description: Directories/files likely involved, and anything out of scope.
    validations: { required: true }
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links to SPEC.md sections, ADRs, related issues. Cloud agents start cold.
