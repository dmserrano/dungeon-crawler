<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dungeon Crawler</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #14121a; /* matches the renderer background */
      }
      body {
        display: flex;
        min-height: 100vh;
      }
      /* margin:auto centres without clipping the top/left when the canvas outgrows the window */
      #app {
        margin: auto;
      }
      #app canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
